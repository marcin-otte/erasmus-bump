<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerBump</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>PeerBump</h1>
    </header>

    <article id="profile-card">
      <div id="guest-banner" style="display: none; margin-bottom: 1rem;">
        <ins id="guest-room-label">Room: <strong id="guest-room-id"></strong></ins>
        <div><small id="guest-status">Connecting to host...</small></div>
      </div>

      <form id="profile-form" novalidate>
        <label for="name">
          Name <span aria-hidden="true" style="color: var(--pico-primary);">*</span>
          <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
        </label>

        <div id="active-fields"></div>

        <select id="field-selector">
          <option value="" disabled selected>+ Add field...</option>
        </select>

        <details id="saved-section">
          <summary>Not shared</summary>
          <div id="inactive-fields"></div>
        </details>

        <hr>

        <button type="submit" class="outline" style="margin-bottom: 0.5rem;">Save Profile</button>
      </form>

      <div id="room-actions">
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" id="btn-host" style="flex: 1; margin-bottom: 0;">Host Room</button>
          <button type="button" class="outline" id="btn-join-toggle" style="flex: 1; margin-bottom: 0;">Join Room</button>
        </div>
        <div id="join-manual" style="display: none; margin-top: 0.5rem;">
          <fieldset role="group" style="margin-bottom: 0;">
            <input type="text" id="manual-room-input" placeholder="Room code">
            <button type="button" id="btn-manual-join">Join</button>
          </fieldset>
        </div>
      </div>

      <div id="guest-actions" style="display: none;">
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" id="btn-send-contact" style="flex: 1; margin-bottom: 0;">Send Contact</button>
          <button type="button" class="outline secondary" id="btn-leave-room" style="flex: 1; margin-bottom: 0;">Leave</button>
        </div>
      </div>
    </article>

    <article id="host-view" style="display: none; text-align: center;">
      <header>
        <h2>Room: <span id="host-room-id"></span></h2>
      </header>

      <div style="background: #ffffff; padding: 1rem; border-radius: 8px; display: inline-block; margin: 0 auto;">
        <div id="qrcode"></div>
      </div>

      <p style="margin-top: 1rem;"><small id="host-link-text"></small></p>

      <div id="host-peers-section" style="margin-top: 1rem;">
        <p><small>Connected (<span id="connected-count">0</span>):</small></p>
        <div id="connected-peers-list" style="display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; min-height: 2rem;"></div>
      </div>

      <button type="button" id="btn-bump" style="margin-top: 1rem;" disabled>Bump Contacts</button>

      <hr>

      <button type="button" class="outline secondary" id="btn-close-room">Close Room</button>
    </article>

    <article id="results-view" style="display: none;">
      <header>
        <h2>Contacts (<span id="results-count">0</span>)</h2>
      </header>

      <div id="results-list"></div>

      <hr>

      <button type="button" class="outline secondary" id="btn-results-done">Done</button>
    </article>
  </main>
</body>
</html>
